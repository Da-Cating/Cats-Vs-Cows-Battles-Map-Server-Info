name: Server Health Check

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping-server:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Check Cloudflare Tunnel Uptime
        id: check_tunnel
        run: |
          if [ ! -f "INFO.txt" ]; then
            echo "Error: INFO.txt not found!"
            echo "status=down" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          TARGET_URL=$(cat INFO.txt | tr -d '[:space:]')
          TARGET_URL="${TARGET_URL}/ping"
          echo "Checking URL: $TARGET_URL"
          
          RESPONSE_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$TARGET_URL" || echo "000")
          echo "Response code: $RESPONSE_CODE"
          
          if [ "$RESPONSE_CODE" -ge 200 ] && [ "$RESPONSE_CODE" -lt 400 ]; then
            echo "Server is ONLINE!"
            echo "status=up" >> $GITHUB_OUTPUT
          else
            echo "Server is OFFLINE!"
            echo "status=down" >> $GITHUB_OUTPUT
            exit 1
          fi

      - name: Restore Previous Status
        id: cache_status
        uses: actions/cache@v4
        with:
          path: status.txt
          key: server-status

      - name: Evaluate State & Send Alert
        if: failure()
        run: |
          # Read previous status if it exists
          PREV_STATUS="up"
          if [ -f "status.txt" ]; then
            PREV_STATUS=$(cat status.txt)
          fi
          
          echo "Previous status was: $PREV_STATUS"
          
          if [ "$PREV_STATUS" = "down" ]; then
            echo "Alert already sent previously. Suppressing notification."
            exit 0 # Exit clean so discord step doesn't run
          fi
          
          echo "down" > status.txt

      - name: Save Down State Cache
        if: failure()
        uses: actions/cache/save@v4
        with:
          path: status.txt
          key: server-status

      - name: Send Phone Alert on First Failure
        if: failure() && steps.cache_status.outputs.cache-hit == 'true'
        uses: rjstone/discord-webhook-notify@v2
        with:
          severity: error
          details: "@Da-Cating Server offline dawg 💔️"
          webhookUrl: ${{ secrets.DIHCORDWEBHOOK }}

      - name: Reset State on Success
        if: success()
        run: |
          echo "up" > status.txt

      - name: Save Up State Cache
        if: success()
        uses: actions/cache/save@v4
        with:
          path: status.txt
          key: server-status
